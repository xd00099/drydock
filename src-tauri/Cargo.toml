[package]
name = "drydock-app"
version = "1.1.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
drydock-core = { path = "../crates/drydock-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
base64 = "0.22"
anyhow = "1"
chrono = "0.4"
libc = "0.2"
getrandom = "0.3"
sha2 = "0.10"
tempfile = "3"
fastembed = { version = "4", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Wake-from-sleep detection (wake.rs). Already in the graph via wry/tauri —
# same versions, no new compile surface.
objc2-app-kit = { version = "0.3", features = ["NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSString", "NSOperation", "block2"] }
block2 = "0.6"

[features]
default = ["semantic"]
semantic = ["dep:fastembed"]
