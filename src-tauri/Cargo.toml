[package]
name = "drydock-app"
version = "1.3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
drydock-core = { path = "../crates/drydock-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
portable-pty = "0.8"
base64 = "0.22"
anyhow = "1"
chrono = "0.4"
libc = "0.2"
getrandom = "0.3"
sha2 = "0.10"
tempfile = "3"
# Text embeddings only: image-models also pulls in AVIF, EXR, TIFF, and other
# codecs. Stay on the 5.8 patch series to keep this upgrade scoped.
fastembed = { version = "~5.8.0", default-features = false, features = ["ort-download-binaries", "hf-hub-native-tls"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Wake-from-sleep detection (wake.rs). Keep the framework bindings narrow;
# AppKit's defaults enable hundreds of APIs beyond those used by us or Tauri.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSNotification", "NSString", "NSOperation", "block2"] }
block2 = "0.6"

[features]
default = ["semantic"]
semantic = ["dep:fastembed"]
