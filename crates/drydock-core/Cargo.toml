[package]
name = "drydock-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
notify = "7"
notify-debouncer-mini = "0.5"

# proc_pidinfo, for the radar's liveness check: it runs once per live session
# every 2s forever, so it answers from a syscall instead of forking `ps`. libc
# is already compiled in this workspace (src-tauri depends on it), so this adds
# a dependency edge, not a crate.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
